<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2>Create Your Profile Card</h2>

            <label>Name/Title:</label>
            <input type="text" id="nameInput" placeholder="e.g., Jane Doe" required>

            <label>Role/Subtitle:</label>
            <input type="text" id="roleInput" placeholder="e.g., Web Designer" required>

            <label>Profile Image URL:</label>
            <input type="url" id="imageInput" placeholder="e.g., https://example.com/photo.jpg" required>

            <button id="generateBtn">Generate Card</button>
        </div>

        <div class="cards-section">
            <h2>Your Generated Cards</h2>
            <div id="cardsContainer" class="cards-container"></div>
        </div>
        <script src="script.js"></script>
</body>
</html>
